# 柜体型号识别配置，单位均为 mm。
# 匹配规则：
# 1. outside_bounds_mm 使用外框原始绝对坐标：[x_min, x_max, y_min, y_max, z_min, z_max]
# 2. inside_bounds_mm 使用内部分区原始绝对坐标：
#    [in_x_min, in_x_max,
#     in_y_min, in_y_max,
#     in_z_min, in_z_max]
# 3. 内部分区会按空间位置排序后一一比对，不再允许无序尺寸匹配。
# 4. x/y/z 使用独立精度，不再共用一个 tolerance_mm。
# 5. jig_bounds_mm 记录挂具 [y_min, y_max, z_min, z_max]，当前识别器不参与匹配。
# 6. reference_source 为基准数据文件；坐标已按 ReadDataConfig 的原点配置转换。

